<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hand Gesture Particles</title>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    z-index:10;
    background:rgba(0,0,0,0.6);
    padding:15px;
    border-radius:10px;
    border:1px solid cyan;
}

#videoCanvas{
    position:absolute;
    right:20px;
    bottom:20px;
    width:220px;
    height:160px;
    border:2px solid white;
    border-radius:10px;
    transform:scaleX(-1);
    z-index:5;
}

</style>

</head>

<body>

<div id="ui">
    <h2>Gesture Particles</h2>

    <p>☝ Move Finger → Push Particles</p>

    <p>🤏 Pinch → Explosion</p>

    <p id="status">Loading...</p>
</div>

<video id="video" autoplay playsinline muted style="display:none"></video>

<canvas id="videoCanvas"></canvas>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

const PARTICLE_COUNT = 3000;

let scene,camera,renderer,particles,geometry;

let handX = 0;
let handY = 0;

let pinch = false;
let handDetected = false;

const video = document.getElementById("video");

const status = document.getElementById("status");

const previewCanvas = document.getElementById("videoCanvas");

const ctx = previewCanvas.getContext("2d");

initThree();
initHandTracking();
animate();

function initThree(){

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth/window.innerHeight,
        0.1,
        1000
    );

    camera.position.z = 30;

    renderer = new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document.body.appendChild(renderer.domElement);

    geometry = new THREE.BufferGeometry();

    const positions = new Float32Array(PARTICLE_COUNT*3);

    const colors = new Float32Array(PARTICLE_COUNT*3);

    for(let i=0;i<PARTICLE_COUNT;i++){

        const i3 = i*3;

        positions[i3] = (Math.random()-0.5)*20;

        positions[i3+1] = (Math.random()-0.5)*20;

        positions[i3+2] = (Math.random()-0.5)*20;

        colors[i3] = 0;

        colors[i3+1] = Math.random();

        colors[i3+2] = 1;
    }

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(positions,3)
    );

    geometry.setAttribute(
        "color",
        new THREE.BufferAttribute(colors,3)
    );

    const material = new THREE.PointsMaterial({

        size:0.18,

        vertexColors:true,

        transparent:true,

        blending:THREE.AdditiveBlending,

        depthWrite:false
    });

    particles = new THREE.Points(
        geometry,
        material
    );

    scene.add(particles);

    window.addEventListener("resize",()=>{

        camera.aspect =
            window.innerWidth/window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    });
}

async function initHandTracking(){

    const hands = new Hands({

        locateFile:(file)=>{
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }
    });

    hands.setOptions({

        maxNumHands:1,

        modelComplexity:1,

        minDetectionConfidence:0.5,

        minTrackingConfidence:0.5
    });

    hands.onResults(onResults);

    const stream =
        await navigator.mediaDevices.getUserMedia({
            video:true
        });

    video.srcObject = stream;

    video.onloadedmetadata = ()=>{

        video.play();

        processVideo();
    };

    async function processVideo(){

        await hands.send({
            image:video
        });

        requestAnimationFrame(processVideo);
    }
}

function onResults(results){

    previewCanvas.width = video.videoWidth || 640;

    previewCanvas.height = video.videoHeight || 480;

    ctx.drawImage(
        results.image,
        0,
        0,
        previewCanvas.width,
        previewCanvas.height
    );

    if(
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ){

        handDetected = true;

        status.innerText = "Hand Detected";

        const landmarks =
            results.multiHandLandmarks[0];

        drawLandmarks(landmarks);

        const indexTip = landmarks[8];

        const thumbTip = landmarks[4];

        handX = (1-indexTip.x)*30 - 15;

        handY = (-indexTip.y)*20 + 10;

        const distance = Math.hypot(
            indexTip.x-thumbTip.x,
            indexTip.y-thumbTip.y
        );

        pinch = distance < 0.05;

        if(pinch){
            status.innerText = "Explosion Mode 💥";
        }

    }else{

        handDetected = false;

        status.innerText = "Searching Hand...";
    }
}

function drawLandmarks(landmarks){

    ctx.fillStyle = "red";

    for(let point of landmarks){

        ctx.beginPath();

        ctx.arc(
            point.x*previewCanvas.width,
            point.y*previewCanvas.height,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

function animate(){

    requestAnimationFrame(animate);

    particles.rotation.y += 0.002;

    const positions =
        geometry.attributes.position.array;

    for(let i=0;i<PARTICLE_COUNT;i++){

        const i3 = i*3;

        let x = positions[i3];

        let y = positions[i3+1];

        let z = positions[i3+2];

        if(handDetected){

            const dx = x - handX;

            const dy = y - handY;

            const distance =
                Math.sqrt(dx*dx + dy*dy);

            const radius = pinch ? 12 : 5;

            if(distance < radius){

                const angle =
                    Math.atan2(dy,dx);

                const force =
                    pinch ? 1.2 : 0.15;

                x += Math.cos(angle)*force;

                y += Math.sin(angle)*force;

                if(pinch){

                    z += (Math.random()-0.5)*2;
                }
            }
        }

        // Floating motion
        x += Math.sin(Date.now()*0.001 + i)*0.002;

        y += Math.cos(Date.now()*0.001 + i)*0.002;

        // Return slowly
        x *= 0.998;

        y *= 0.998;

        z *= 0.998;

        positions[i3] = x;

        positions[i3+1] = y;

        positions[i3+2] = z;
    }

    geometry.attributes.position.needsUpdate = true;

    renderer.render(scene,camera);
}

</script>

</body>
</html>
